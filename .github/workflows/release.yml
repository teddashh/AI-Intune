name: Release images

# Publishes the Hub images to GHCR on a version tag (vX.Y.Z), multi-arch
# (linux/amd64 + linux/arm64), with BuildKit SBOM + provenance attestations,
# a per-platform SPDX SBOM attested with cosign, and cosign keyless
# signatures (GitHub OIDC → Fulcio, logged in Rekor).
#
# Pull requests that touch the release inputs, and manual runs, do a dry run:
# the same build, SBOM, attest, sign and verify steps against a throwaway
# registry inside the job, signed with an ephemeral key instead of keyless.
# Nothing is pushed to GHCR and nothing is written to the transparency log.
#
# Verify a published image:
#   cosign verify ghcr.io/teddashh/clawctl-hub:<version> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/teddashh/AI-Intune/\.github/workflows/release\.yml@refs/tags/v'

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - ops/docker/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.target }} (${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'publish' || 'dry run' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR (publish only)
      id-token: write # cosign keyless OIDC token (publish only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: hub
            image: clawctl-hub
          - target: hub-init
            image: clawctl-hub-init
    services:
      # Dry-run registry. Present on every run (services cannot be
      # conditional); publish runs never push to it.
      registry:
        image: registry:2.8.3
        ports:
          - 5000:5000
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      PLATFORMS: linux/amd64,linux/arm64
      CERT_ISSUER: https://token.actions.githubusercontent.com
      CERT_IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version and image reference
        id: ref
        env:
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$PUBLISH" = "true" ]; then
            # The tag becomes CLAWCTL_VERSION (baked into the binaries and the
            # agent bootstrap path), so it must be a clean semantic version.
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "tag $REF_NAME is not vMAJOR.MINOR.PATCH[-pre]" >&2
              exit 1
            fi
            version=$REF_NAME
            repo="ghcr.io/$owner/$IMAGE"
          else
            version="dryrun-${GITHUB_SHA::12}"
            repo="localhost:5000/$owner/$IMAGE"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "repo=$repo" >>"$GITHUB_OUTPUT"
          echo "version=$version repo=$repo publish=$PUBLISH"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # host networking lets BuildKit reach the dry-run registry on localhost
          driver-opts: network=host
          # The dry-run registry speaks plain HTTP. Publish runs never use it.
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.repo }}
          tags: |
            type=raw,value=${{ steps.ref.outputs.version }}
            type=semver,pattern={{version}},enable=${{ env.PUBLISH == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.PUBLISH == 'true' }}
          # vX.Y.Z (the exact CLAWCTL_VERSION baked into the binaries and the
          # seeded agent bootstrap path), X.Y.Z, X.Y and latest (stable only).
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.ref.outputs.version }}

      - name: Build and push (${{ env.PLATFORMS }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ops/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          build-args: CLAWCTL_VERSION=${{ steps.ref.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Platform manifests
        id: platforms
        env:
          REF: ${{ steps.ref.outputs.repo }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$REF" >index.json
          # One manifest per platform plus BuildKit's attestation manifests
          # (platform unknown/unknown). Fail if either architecture is missing.
          for arch in amd64 arm64; do
            d=$(jq -r --arg a "$arch" '.manifests[] | select(.platform.os=="linux" and .platform.architecture==$a) | .digest' index.json)
            [ -n "$d" ] || { echo "no linux/$arch manifest in $REF" >&2; exit 1; }
            echo "$arch=$d" >>"$GITHUB_OUTPUT"
          done
          att=$(jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"]=="attestation-manifest")] | length' index.json)
          echo "BuildKit attestation manifests: $att"
          [ "$att" -ge 2 ] || { echo "expected SBOM/provenance attestation manifests for both platforms" >&2; exit 1; }

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft

      - name: SPDX SBOM per platform
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          REPO: ${{ steps.ref.outputs.repo }}
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
          SYFT_REGISTRY_INSECURE_USE_HTTP: ${{ env.PUBLISH != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          "$SYFT" scan "registry:$REPO@$AMD64" -o "spdx-json=sbom/${{ matrix.image }}-linux-amd64.spdx.json"
          "$SYFT" scan "registry:$REPO@$ARM64" -o "spdx-json=sbom/${{ matrix.image }}-linux-arm64.spdx.json"
          for f in sbom/*.json; do
            n=$(jq '.packages | length' "$f")
            echo "$f: $n packages"
            [ "$n" -gt 0 ] || { echo "$f has no packages" >&2; exit 1; }
          done

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Dry run signing key (ephemeral)
        if: env.PUBLISH != 'true'
        env:
          COSIGN_PASSWORD: ""
        run: cosign generate-key-pair

      - name: Sign and attest
        env:
          REPO: ${{ steps.ref.outputs.repo }}
          INDEX: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            opts=(--yes)
          else
            # Ephemeral key, local registry, no transparency log. cosign v3
            # accepts --tlog-upload=false only without a signing config.
            opts=(--yes --key cosign.key --use-signing-config=false --tlog-upload=false --allow-insecure-registry --allow-http-registry)
          fi
          # --recursive signs the index and every manifest it lists.
          cosign sign "${opts[@]}" --recursive "$REPO@$INDEX"
          cosign attest "${opts[@]}" --type spdxjson --predicate "sbom/${{ matrix.image }}-linux-amd64.spdx.json" "$REPO@$AMD64"
          cosign attest "${opts[@]}" --type spdxjson --predicate "sbom/${{ matrix.image }}-linux-arm64.spdx.json" "$REPO@$ARM64"

      - name: Verify signatures and SBOM attestations
        env:
          REPO: ${{ steps.ref.outputs.repo }}
          INDEX: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            opts=(--certificate-oidc-issuer "$CERT_ISSUER" --certificate-identity-regexp "$CERT_IDENTITY_REGEXP")
          else
            opts=(--key cosign.pub --insecure-ignore-tlog=true --allow-insecure-registry --allow-http-registry)
          fi
          cosign verify "${opts[@]}" "$REPO@$INDEX" >/dev/null
          for d in "$AMD64" "$ARM64"; do
            cosign verify "${opts[@]}" "$REPO@$d" >/dev/null
            cosign verify-attestation "${opts[@]}" --type spdxjson "$REPO@$d" >/dev/null
          done
          echo "verified: index, both platforms, both SPDX attestations"

      - name: Remove the ephemeral key
        if: always() && env.PUBLISH != 'true'
        run: rm -f cosign.key cosign.pub

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}-${{ steps.ref.outputs.version }}
          path: sbom/
          retention-days: ${{ env.PUBLISH == 'true' && 90 || 7 }}

      - name: Summary
        env:
          REPO: ${{ steps.ref.outputs.repo }}
          INDEX: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mode="dry run"
          [ "$PUBLISH" = "true" ] && mode="published"
          {
            echo "### ${{ matrix.image }} ($mode)"
            echo
            echo "- index: \`$REPO@$INDEX\`"
            echo "- platforms: $PLATFORMS"
            echo "- tags:"
            while IFS= read -r t; do if [ -n "$t" ]; then echo "  - \`$t\`"; fi; done <<<"$TAGS"
          } >>"$GITHUB_STEP_SUMMARY"
