# Litestream 0.5 config for the Fly image.
# ${NAME} is expanded by Litestream (os.Expand), not by a shell.
# The entrypoint exports LITESTREAM_BUCKET, LITESTREAM_PATH, and
# LITESTREAM_ENDPOINT before starting Litestream. Defaults are not
# written here because Litestream does not apply ${NAME:-default}.
dbs:
  - path: /var/lib/clawctl/clawctl.sqlite
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: ${LITESTREAM_PATH}
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        access-key-id: ${R2_ACCESS_KEY_ID}
        secret-access-key: ${R2_SECRET_ACCESS_KEY}
        force-path-style: true
